name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "scripts/installer/**"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build MSI
        shell: pwsh
        run: |
          # Version and ProductCode come from installer/InstallerVersion.props so
          # they always move together; a tag must match that version.
          [xml]$props = Get-Content -LiteralPath installer/InstallerVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.InstallerProductVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match InstallerProductVersion $version."
          }
          ./scripts/installer/Build-Installer.ps1 -Configuration Release
      - name: Smoke-test the trimmed broker
        shell: pwsh
        run: |
          # The broker is published trimmed; prove the trimmed runtime starts,
          # parses arguments and keeps its console server (pipe + ETW setup)
          # alive instead of failing on a trimmed-away framework member.
          [xml]$props = Get-Content -LiteralPath installer/InstallerVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.InstallerProductVersion
          $broker = Join-Path $PWD ".artifacts/validation/installer-packaging/publish/$version/broker/MonitoringXS.PrivilegedBroker.exe"
          $usage = Start-Process -FilePath $broker -NoNewWindow -Wait -PassThru
          if ($usage.ExitCode -ne 64) { throw "Broker without arguments exited $($usage.ExitCode), expected 64." }
          $console = Start-Process -FilePath $broker -ArgumentList '--console' -NoNewWindow -PassThru
          Start-Sleep -Seconds 8
          if ($console.HasExited) { throw "Broker --console exited early with $($console.ExitCode)." }
          Stop-Process -Id $console.Id -Force
          Write-Output 'Trimmed broker started and stayed up.'
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitoringXS-installer
          path: .artifacts/validation/installer-packaging/package/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/validation/installer-packaging/package/*.msi
          prerelease: true
          generate_release_notes: true
