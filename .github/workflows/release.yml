name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "scripts/installer/**"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build MSI
        shell: pwsh
        run: |
          # Version and ProductCode come from installer/InstallerVersion.props so
          # they always move together; a tag must match that version.
          [xml]$props = Get-Content -LiteralPath installer/InstallerVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.InstallerProductVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match InstallerProductVersion $version."
          }
          ./scripts/installer/Build-Installer.ps1 -Configuration Release
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitoringXS-installer
          path: .artifacts/validation/installer-packaging/package/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test the trimmed broker service
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          # The broker is published trimmed. Install the MSI on the runner, prove
          # the service starts and stays running (service host, service-SID pipe
          # security, broker server), then uninstall. Release tags skip this.
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath installer/InstallerVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.InstallerProductVersion
          $root = Join-Path $PWD '.artifacts/validation/installer-packaging'
          $msi = Join-Path $root "package/MonitoringXS-$version-x64.msi"
          $broker = Join-Path $root "publish/$version/broker/MonitoringXS.PrivilegedBroker.exe"
          $usage = Start-Process -FilePath $broker -NoNewWindow -Wait -PassThru
          if ($usage.ExitCode -ne 64) { throw "Broker without arguments exited $($usage.ExitCode), expected 64." }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          $log = Join-Path $root 'smoke-install.log'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', "`"$msi`"", '/qn', '/norestart',
            "BROKER_USER_SID=$($identity.User.Value)", "BROKER_SESSION_ID=$sessionId",
            '/L*v', "`"$log`"")
          Write-Output "Install exit code: $($install.ExitCode) (session $sessionId)"
          try {
            if ($install.ExitCode -notin 0, 3010) { throw "MSI install failed with $($install.ExitCode); see smoke-install.log." }
            Start-Sleep -Seconds 10
            $service = Get-Service -Name 'MonitoringXS.PrivilegedEtwBroker'
            if ($service.Status -ne 'Running') { throw "Broker service is $($service.Status) 10 s after install." }
            $process = Get-CimInstance Win32_Service -Filter "Name='MonitoringXS.PrivilegedEtwBroker'"
            $workingSet = (Get-Process -Id $process.ProcessId).WorkingSet64
            Write-Output "Trimmed broker service is running (PID $($process.ProcessId), working set $workingSet bytes)."
          } finally {
            $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart')
            Write-Output "Uninstall exit code: $($uninstall.ExitCode)"
          }
      - name: Upload smoke-install log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-install-log
          path: .artifacts/validation/installer-packaging/smoke-install.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/validation/installer-packaging/package/*.msi
          prerelease: true
          generate_release_notes: true
