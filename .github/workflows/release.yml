name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "scripts/installer/**"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build MSI
        shell: pwsh
        run: |
          # Version and ProductCode come from installer/InstallerVersion.props so
          # they always move together; a tag must match that version.
          [xml]$props = Get-Content -LiteralPath installer/InstallerVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.InstallerProductVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match InstallerProductVersion $version."
          }
          ./scripts/installer/Build-Installer.ps1 -Configuration Release
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitoringXS-installer
          path: .artifacts/validation/installer-packaging/package/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/validation/installer-packaging/package/*.msi
          prerelease: true
          generate_release_notes: true
