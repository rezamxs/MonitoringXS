name: Feature Request
description: Suggest a new feature or improvement for Monitoring XS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please fill out the fields below.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Before submitting, please confirm the following.
      options:
        - label: I have searched existing issues and feature requests for similar ideas.
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: What problem would this feature solve? Why is it needed?
      placeholder: Describe the problem or use case that motivates this request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the feature or improvement you would like to see.
      placeholder: Describe your proposed solution.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example / use case
      description: Provide a concrete example or scenario where this feature would help.
      placeholder: e.g. When monitoring X, I want to see Y so that Z. (optional)
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered alternative solutions or workarounds?
      placeholder: Describe any alternatives you have tried or considered. (optional)
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Which area does this feature relate to?
      options:
        - Monitoring metrics
        - Processes
        - History
        - Diagnostics
        - UI / UX
        - Installer
        - Export
        - Hardware monitoring
        - Notifications
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information, mockups, or references that may be helpful.
      placeholder: Additional details, related discussions, links, etc. (optional).
    validations:
      required: false